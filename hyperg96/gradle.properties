org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.daemon=false
android.useAndroidX=true
android.nonTransitiveRClass=true
# Caminho do repo contem acentos ("Projeto Padrao"); o AGP bloqueia nao-ASCII
# por padrao. E o override documentado pelo proprio AGP para manter o build.
android.overridePathCheck=true
