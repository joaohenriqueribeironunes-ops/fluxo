name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch: # disparo manual

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # O runner do GitHub ja traz Android SDK 36 + build-tools 36.0.0 e o
      # ANDROID_HOME configurado; nao precisamos do setup-android (que baixa
      # cmdline-tools 16.0 e quebra no '--licenses').
      - name: Conferir Android SDK disponivel
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      # O lockfile fica dessincronizado com os pacotes do Capacitor; 'npm install'
      # reconcilia em vez de abortar como o 'npm ci' faz.
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Build do web
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # O runner nao tem ~/.android/debug.keystore; sem ela o signingConfig de
      # release falha. Geramos uma com keytool (mesmos dados da keystore padrao).
      - name: Gerar debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -l "$HOME/.android/debug.keystore"

      - name: Build APK (debug)
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      # A release precisa ser assinada, senao o Android recusa a instalacao.
      # Usamos a debug keystore gerada pelo proprio runner.
      - name: Build APK (release, assinado)
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      - name: Renomear APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/fluxo-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk out/fluxo-release.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/fluxo-release.apk
          fi
          ls -lh out

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: fluxo-apk
          path: out/*.apk
          retention-days: 90

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
