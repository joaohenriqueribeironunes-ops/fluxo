[project]
name = "fluxo"
version = "1.0.0"
description = "Fluxo - foco, som e estimulo sensorial para cerebro TEA/TDAH (local-first)"
requires-python = ">=3.10"
dependencies = ["flet==1.0.4", "flet-audio==1.0.4"]

[tool.flet]
org = "dev.fluxo"
